<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In / Sign Up — Kaamgar</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#16223B; --yellow:#F2B705; --rust:#C1502E; --concrete:#8B8680; --cream:#FAF7F0; --line:#D8D3C6; --good:#2E7D4F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--navy); min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif; padding:24px;
  }
  .card{background:var(--cream); border-radius:14px; padding:40px; width:100%; max-width:420px; box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);}
  .logo{display:flex; align-items:center; gap:10px; margin-bottom:28px;}
  .logo-mark{width:34px; height:34px; background:var(--navy); border-radius:4px; display:flex; align-items:center; justify-content:center; color:var(--yellow); font-family:'Barlow Condensed'; font-weight:800; font-size:20px;}
  .logo-text{font-family:'Barlow Condensed'; font-weight:700; font-size:22px; color:var(--navy); text-transform:uppercase;}
  h1{font-family:'Barlow Condensed'; font-weight:800; font-size:28px; text-transform:uppercase; color:var(--navy); margin-bottom:6px;}
  .sub{color:var(--concrete); font-size:14px; margin-bottom:24px;}
  .tabs{display:flex; gap:0; margin-bottom:22px; border-radius:8px; overflow:hidden; border:1px solid var(--line);}
  .tab{flex:1; text-align:center; padding:10px; font-size:13px; font-weight:700; cursor:pointer; background:#fff; color:var(--navy);}
  .tab.active{background:var(--navy); color:var(--cream);}
  .role-row{display:flex; gap:10px; margin-bottom:16px;}
  .role-btn{flex:1; text-align:center; padding:10px; border:1.5px solid var(--line); border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; background:#fff;}
  .role-btn.active{border-color:var(--rust); background:#FDF3EC; color:var(--rust);}
  form{display:none;}
  form.active{display:block;}
  input{width:100%; border:1.5px solid var(--line); border-radius:8px; padding:12px 14px; font-size:14px; margin-bottom:12px; font-family:'Inter';}
  input:focus{border-color:var(--navy); outline:none;}
  button.submit{
    width:100%; padding:13px; border:none; border-radius:8px; background:var(--yellow); color:var(--navy);
    font-family:'Inter'; font-weight:700; font-size:14px; cursor:pointer; box-shadow:0 2px 0 #D9A400;
  }
  .msg{font-size:13px; font-weight:600; padding:10px 12px; border-radius:6px; margin-top:12px; display:none;}
  .msg.show{display:block;}
  .msg.ok{background:rgba(46,125,79,0.1); color:var(--good);}
  .msg.err{background:rgba(193,80,46,0.1); color:var(--rust);}
  .back{display:block; text-align:center; margin-top:20px; font-size:13px; color:var(--concrete); text-decoration:none;}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-mark">K</div>
    <div class="logo-text">Kaamgar</div>
  </div>
  <h1 id="pageTitle">Welcome back</h1>
  <div class="sub" id="pageSub">Log in to manage your bookings or jobs.</div>

  <div class="tabs">
    <div class="tab active" id="tabLogin" onclick="switchTab('login')">Log In</div>
    <div class="tab" id="tabSignup" onclick="switchTab('signup')">Sign Up</div>
  </div>

  <!-- LOGIN FORM -->
  <form id="loginForm" class="active" onsubmit="handleLogin(event)">
    <input type="email" id="loginEmail" placeholder="Email address" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit" class="submit" id="loginBtn">Log In</button>
    <div class="msg" id="loginMsg"></div>
  </form>

  <!-- SIGNUP FORM -->
  <form id="signupForm" onsubmit="handleSignup(event)">
    <div class="role-row">
      <div class="role-btn active" id="roleCustomer" onclick="setRole('customer')">I'm a customer</div>
      <div class="role-btn" id="roleWorker" onclick="setRole('worker')">I'm a worker</div>
    </div>
    <input type="text" id="signupName" placeholder="Full name" required>
    <input type="tel" id="signupPhone" placeholder="Phone number" required>
    <input type="email" id="signupEmail" placeholder="Email address" required>
    <input type="password" id="signupPassword" placeholder="Create a password (min 6 characters)" required minlength="6">
    <button type="submit" class="submit" id="signupBtn">Create Account</button>
    <div class="msg" id="signupMsg"></div>
  </form>

  <a class="back" href="index.html">← Back to Kaamgar</a>
</div>

<script>
  const sb = supabase.createClient(
    "https://vyxkeoujbwukdlzlaiad.supabase.co",
    "sb_publishable_RkjM59RJTjzI3fPlIWMk_g_jAcJXlYt"
  );

  let selectedRole = 'customer';

  function setRole(role){
    selectedRole = role;
    document.getElementById('roleCustomer').classList.toggle('active', role === 'customer');
    document.getElementById('roleWorker').classList.toggle('active', role === 'worker');
  }

  function switchTab(tab){
    const isLogin = tab === 'login';
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabSignup').classList.toggle('active', !isLogin);
    document.getElementById('loginForm').classList.toggle('active', isLogin);
    document.getElementById('signupForm').classList.toggle('active', !isLogin);
    document.getElementById('pageTitle').textContent = isLogin ? 'Welcome back' : 'Create your account';
    document.getElementById('pageSub').textContent = isLogin ? 'Log in to manage your bookings or jobs.' : 'Join Kaamgar as a customer or a worker.';
  }

  async function handleLogin(e){
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('loginMsg');
    btn.disabled = true; btn.textContent = 'Logging in…';

    const { data, error } = await sb.auth.signInWithPassword({
      email: document.getElementById('loginEmail').value.trim(),
      password: document.getElementById('loginPassword').value,
    });

    btn.disabled = false; btn.textContent = 'Log In';
    msg.classList.remove('ok','err');
    if(error){
      msg.textContent = error.message;
      msg.classList.add('err','show');
    } else {
      msg.textContent = '✓ Logged in — redirecting…';
      msg.classList.add('ok','show');
      setTimeout(() => window.location.href = 'index.html', 800);
    }
  }

  async function handleSignup(e){
    e.preventDefault();
    const btn = document.getElementById('signupBtn');
    const msg = document.getElementById('signupMsg');
    btn.disabled = true; btn.textContent = 'Creating account…';

    const { data, error } = await sb.auth.signUp({
      email: document.getElementById('signupEmail').value.trim(),
      password: document.getElementById('signupPassword').value,
      options: {
        data: {
          full_name: document.getElementById('signupName').value.trim(),
          phone: document.getElementById('signupPhone').value.trim(),
          role: selectedRole,
        }
      }
    });

    btn.disabled = false; btn.textContent = 'Create Account';
    msg.classList.remove('ok','err');
    if(error){
      msg.textContent = error.message;
      msg.classList.add('err','show');
    } else {
      msg.textContent = '✓ Account created — check your email to confirm, then log in.';
      msg.classList.add('ok','show');
      e.target.reset();
    }
  }
</script>
</body>
</html>
