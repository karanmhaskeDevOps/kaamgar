<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Kaamgar</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --navy:#16223B; --yellow:#F2B705; --rust:#C1502E; --concrete:#8B8680; --cream:#FAF7F0; --line:#D8D3C6; --good:#2E7D4F; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--navy); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; padding:24px;}
  .card{background:var(--cream); border-radius:14px; padding:40px; width:100%; max-width:400px; box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);}
  h1{font-family:'Barlow Condensed'; font-weight:800; font-size:26px; text-transform:uppercase; color:var(--navy); margin-bottom:6px;}
  .sub{color:var(--concrete); font-size:14px; margin-bottom:22px;}
  input{width:100%; border:1.5px solid var(--line); border-radius:8px; padding:12px 14px; font-size:14px; margin-bottom:12px; font-family:'Inter';}
  button{width:100%; padding:13px; border:none; border-radius:8px; background:var(--yellow); color:var(--navy); font-weight:700; font-size:14px; cursor:pointer;}
  .msg{font-size:13px; font-weight:600; padding:10px 12px; border-radius:6px; margin-top:12px; display:none;}
  .msg.show{display:block;}
  .msg.ok{background:rgba(46,125,79,0.1); color:var(--good);}
  .msg.err{background:rgba(193,80,46,0.1); color:var(--rust);}
</style>
</head>
<body>
<div class="card">
  <h1>Set a new password</h1>
  <div class="sub">You followed a reset link — choose a new password below.</div>
  <form onsubmit="handleReset(event)">
    <input type="password" id="newPassword" placeholder="New password (min 6 characters)" required minlength="6">
    <button type="submit" id="resetBtn">Update Password</button>
    <div class="msg" id="resetMsg"></div>
  </form>
</div>
<script>
  const sb = supabase.createClient(
    "https://vyxkeoujbwukdlzlaiad.supabase.co",
    "sb_publishable_RkjM59RJTjzI3fPlIWMk_g_jAcJXlYt"
  );

  // Supabase automatically reads the reset token from the URL and creates
  // a temporary session, so all we need to do is update the password.
  async function handleReset(e){
    e.preventDefault();
    const btn = document.getElementById('resetBtn');
    const msg = document.getElementById('resetMsg');
    btn.disabled = true; btn.textContent = 'Updating…';

    const { error } = await sb.auth.updateUser({ password: document.getElementById('newPassword').value });

    btn.disabled = false; btn.textContent = 'Update Password';
    msg.classList.remove('ok','err');
    if(error){
      msg.textContent = error.message;
      msg.classList.add('err','show');
    } else {
      msg.textContent = '✓ Password updated — redirecting to log in…';
      msg.classList.add('ok','show');
      setTimeout(() => window.location.href = 'login.html', 1500);
    }
  }
</script>
</body>
</html>
